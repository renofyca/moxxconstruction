<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Renofy | Website Under Maintenance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.page {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* Blurred background fills empty screen areas */
.background-fill {
    position: absolute;
    inset: -30px;
    width: calc(100% + 60px);
    height: calc(100% + 60px);

    background-image:
        url("https://drive.google.com/thumbnail?id=1hDIwkkDGtxDEhKzqX3U5JFx2pQMWkrFb&sz=w3840");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    filter: blur(25px);
    transform: scale(1.08);

    z-index: 1;
}

/* Dark overlay */
.background-overlay {
    position: absolute;
    inset: 0;

    background: rgba(0, 0, 0, 0.35);

    z-index: 2;
}

/* Main Renofy maintenance image */
.background {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 100%;
    height: 100%;

    transform: translate(-50%, -50%);

    object-fit: contain;
    object-position: center center;

    display: block;

    z-index: 3;
}

/* Loading bar */
.loading-bar {
    position: absolute;

    left: 35.68%;
    top: 59.18%;

    width: 28.71%;
    height: 2.83%;

    border: 3px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;

    background: rgba(5, 7, 8, 0.90);

    overflow: hidden;

    z-index: 10;

    box-shadow: 0 0 3px rgba(255, 255, 255, 0.15);
}

/* Animated cyan loading fill */
.loading-fill {
    position: absolute;

    left: 3px;
    top: 3px;
    bottom: 3px;

    width: 12%;

    border-radius: 999px;

    background: linear-gradient(
        90deg,
        #08c4cd 0%,
        #13dce0 70%,
        #c7ffff 100%
    );

    box-shadow:
        0 0 9px rgba(16, 221, 224, 0.9),
        0 0 22px rgba(16, 221, 224, 0.45);

    animation: load 2.4s ease-in-out infinite;
}

/* Moving shine */
.loading-fill::after {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    left: -30%;
    width: 24%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.95),
        transparent
    );

    animation: shine 1.4s linear infinite;
}

/* Loading animation */
@keyframes load {
    0% {
        width: 12%;
    }

    50% {
        width: 78%;
    }

    100% {
        width: 12%;
    }
}

/* Shine animation */
@keyframes shine {
    from {
        left: -30%;
    }

    to {
        left: 115%;
    }
}

/* Mobile */
@media (max-width: 700px) {
    .loading-bar {
        border-width: 2px;
    }

    .loading-fill {
        left: 2px;
        top: 2px;
        bottom: 2px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .loading-fill,
    .loading-fill::after {
        animation: none;
    }
}
</style>

</head>

<body>

<div class="page">

    <!-- Blurred background -->
    <div class="background-fill"></div>

    <!-- Dark overlay -->
    <div class="background-overlay"></div>

    <!-- Main maintenance graphic -->
    <img
        class="background"
        src="https://drive.google.com/thumbnail?id=1hDIwkkDGtxDEhKzqX3U5JFx2pQMWkrFb&sz=w3840"
        alt="Renofy Website Under Maintenance"
    >

    <!-- Animated loading bar -->
    <div
        class="loading-bar"
        aria-label="Website maintenance progress"
    >
        <div class="loading-fill"></div>
    </div>

</div>

</body>
</html>
